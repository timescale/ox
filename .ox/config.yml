# Ox project configuration
# Generated by 'ox config'
# https://github.com/timescale/ox
---
tigerServiceId: null
dockerInSandbox: true
initScript: |
  mkdir -p $HOME/.config/ox
  cat >$HOME/.config/ox/config.yml <<'EOF'
  sandboxProvider: docker
  EOF
  printf '\nexport PATH="$HOME/go/bin:$PATH"\nexport VHS_NO_SANDBOX=1\n' >> $HOME/.bashrc
  export PATH="$HOME/go/bin:$PATH"
  export VHS_NO_SANDBOX=1
  ./bun i
projectSetupLayer: |
  set -exo pipefail
  export DEBIAN_FRONTEND=noninteractive
  if [ -f /etc/os-release ] && grep -q 'ID=ubuntu' /etc/os-release; then
    add-apt-repository ppa:longsleep/golang-backports -y
    add-apt-repository ppa:xtradeb/apps -y
    apt-get update
    apt-get install -y --no-install-recommends ffmpeg golang-go libnspr4 libnss3 chromium
  else
    apt-get update
    apt-get install -y --no-install-recommends ffmpeg golang-go libnspr4 libnss3 chromium-headless-shell
    ln -sf /usr/bin/chromium-headless-shell /usr/local/bin/chromium
    ln -sf /usr/bin/chromium-headless-shell /usr/local/bin/google-chrome
  fi
  case "$(uname -m)" in
    x86_64|amd64)
      curl -fsSL https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -o /usr/local/bin/ttyd
      ;;
    arm64|aarch64)
      curl -fsSL https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.aarch64 -o /usr/local/bin/ttyd
      ;;
    *)
      echo "Unsupported architecture for ttyd binary: $(uname -m)" >&2
      exit 1
      ;;
  esac
  chmod +x /usr/local/bin/ttyd
  rm -rf /var/lib/apt/lists/*
  go install github.com/charmbracelet/vhs@latest
overlayMounts: 
  - node_modules
  - download
