# Ox project configuration
# Generated by 'ox config'
# https://github.com/timescale/ox
---
tigerServiceId: null
dockerInSandbox: true
initScript: |
  mkdir -p $HOME/.config/ox
  cat >$HOME/.config/ox/config.yml <<'EOF'
  sandboxProvider: docker
  EOF
  printf '\nexport PATH="$HOME/go/bin:$PATH"\nexport VHS_NO_SANDBOX=1\n' >> $HOME/.bashrc
  export PATH="$HOME/go/bin:$PATH"
  export VHS_NO_SANDBOX=1
  ./bun i
projectSetupLayer: |
  set -exo pipefail
  apt-get update && apt-get install -y software-properties-common
  add-apt-repository ppa:longsleep/golang-backports -y
  add-apt-repository ppa:xtradeb/apps -y
  apt-get update 
  apt-get install -y ffmpeg golang-go ttyd ca-certificates curl fuse-overlayfs libnspr4 libnss3 chromium
  rm -rf /var/lib/apt/lists/*
  go install github.com/charmbracelet/vhs@latest
overlayMounts: 
  - node_modules
  - download
